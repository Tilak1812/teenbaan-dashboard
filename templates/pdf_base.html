<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Teenbaan Report{% endblock %}</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fff;
            padding: 40px;
            font-size: 14px;
        }
        
        /* Report Header */
        .report-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid;
        }
        
        .report-header.company-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .report-header.company-name.primary {
            color: #667eea;
        }
        
        .report-header.company-name.success {
            color: #27ae60;
        }
        
        .report-header.company-name.danger {
            color: #e74c3c;
        }
        
        .report-header .subtitle {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        
        .report-header .tagline {
            color: #95a5a6;
            font-size: 0.9rem;
            font-style: italic;
        }
        
        /* Report Meta Information */
        .report-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .report-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .report-meta .label {
            color: #7f8c8d;
            font-weight: 600;
        }
        
        .report-meta .value {
            color: #2c3e50;
            font-weight: 500;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }
        
        .stat-box.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .stat-box.success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }
        
        .stat-box.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        
        .stat-box.warning {
            background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
        }
        
        .stat-box.info {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        
        .stat-box .value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-box .label {
            font-size: 0.85rem;
            opacity: 0.95;
        }
        
        /* Sections */
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title .icon {
            font-size: 1.3rem;
        }
        
        /* Tables */
        .table-wrapper {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }
        
        th.success {
            background: #27ae60;
        }
        
        th.danger {
            background: #e74c3c;
        }
        
        tr:nth-child(even) {
            background: #f8f9fa;
        }
        
        tr:hover {
            background: #f0f2f5;
        }
        
        .text-right {
            text-align: right;
        }
        
        .text-center {
            text-align: center;
        }
        
        .text-bold {
            font-weight: bold;
        }
        
        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        /* Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
        }
        
        .card.success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }
        
        .card.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        
        .card.warning {
            background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
        }
        
        .card h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }
        
        .card .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .card .stat-row:last-child {
            border-bottom: none;
        }
        
        .card .stat-label {
            opacity: 0.9;
        }
        
        .card .stat-value {
            font-weight: bold;
        }
        
        /* Chart Placeholders */
        .chart-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-box {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
        }
        
        .chart-box h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        
        .chart-placeholder {
            height: 200px;
            background: #f8f9fa;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
        }
        
        /* Summary Box */
        .summary-box {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .summary-box h3 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        .summary-item {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .summary-item .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .summary-item .label {
            color: #7f8c8d;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        
        /* Footer */
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            text-align: center;
            color: #95a5a6;
            font-size: 0.85rem;
        }
        
        .footer .company {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .footer .timestamp {
            color: #7f8c8d;
            font-size: 0.8rem;
        }
        
        /* Page Break for Printing */
        .page-break {
            page-break-before: always;
        }
        
        /* Responsive */
        @media print {
            body {
                padding: 20px;
                font-size: 12px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .chart-section {
                grid-template-columns: 1fr;
            }
            
            .summary-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media screen and (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .chart-section {
                grid-template-columns: 1fr;
            }
            
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    {% block footer %}
    <div class="footer">
        <div class="company">📊 Teenbaan Order Management System</div>
        <div class="timestamp">Report generated on {{ generated_at }}</div>
        {% if username %}
        <div class="timestamp">Generated by: {{ username }}</div>
        {% endif %}
    </div>
    {% endblock %}
</body>
</html>
