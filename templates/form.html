{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block title %}Add Order - Teenbaan{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-left">
        <h1>➕ Add New Order</h1>
    </div>
    <div class="header-actions">
        <a href="{{ url_for('orders') }}" class="btn btn-secondary">← Back to Orders</a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2>📦 Order Details</h2>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>📅 Date</label>
                    <input type="date" name="date" required value="{{ today }}">
                </div>
                
                <div class="form-group">
                    <label>📆 Day</label>
                    <input type="text" name="day" id="day" required placeholder="Monday" readonly>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>🕐 Time</label>
                    <div class="time-inputs">
                        <select name="hour" required>
                            {% for h in range(1, 13) %}
                            <option value="{{ h }}">{{ '%02d'|format(h) }}</option>
                            {% endfor %}
                        </select>
                        <span>:</span>
                        <select name="minute" required>
                            {% for m in range(0, 60, 5) %}
                            <option value="{{ m }}">{{ '%02d'|format(m) }}</option>
                            {% endfor %}
                        </select>
                        <select name="ampm" required>
                            <option value="AM">AM</option>
                            <option value="PM">PM</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>📦 Number of Orders</label>
                    <input type="number" name="orders" required min="1" placeholder="1">
                </div>
                
                <div class="form-group">
                    <label>💰 Amount Spent (₹)</label>
                    <input type="number" name="amount" required min="0" step="0.01" placeholder="0.00">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">➕ Add Order</button>
                <a href="{{ url_for('orders') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dateInput = document.querySelector('input[name="date"]');
    const dayInput = document.querySelector('#day');
    
    function updateDay() {
        const date = dateInput.value;
        if (date) {
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dateObj = new Date(date);
            const dayIndex = dateObj.getDay();
            dayInput.value = dayNames[dayIndex];
        }
    }
    
    dateInput.addEventListener('change', updateDay);
    updateDay();
});
</script>
{% endblock %}
