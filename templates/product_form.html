{% extends "base.html" %}

{% block title %}{{ action }} Product - Teenbaan{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div class="header-left">
            <h1>📦 {{ action }} Product</h1>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('products') }}" class="btn-secondary">← Back to Products</a>
        </div>
    </div>

    <div class="form-container">
        <form method="POST" class="order-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name</label>
                    <input type="">Product Name *text" id="name" name=" 
                           value="{{name" required product.name if product else '' }}"
                           placeholder="Enter product name" class="form-input">
                </div>
                
                <div class="form-group">
                    <label for="sku">SKU</label>
                    <input type="text" id="sku" name="sku" 
                           value="{{ product.sku if product else '' }}"
                           placeholder="Enter SKU (optional)" class="form-input">
                </div>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" 
                          placeholder="Enter product description" class="form-input">{{ product.description if product else '' }}</textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="price">Selling Price (₹) *</label>
                    <input type="number" id="price" name="price" required 
                           min="0" step="0.01"
                           value="{{ product.price if product else '' }}"
                           placeholder="0.00" class="form-input">
                </div>
                
                <div class="form-group">
                    <label for="cost_price">Cost Price (₹)</label>
                    <input type="number" id="cost_price" name="cost_price" 
                           min="0" step="0.01"
                           value="{{ product.cost_price if product else '' }}"
                           placeholder="0.00" class="form-input">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id" class="form-input">
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="stock">Stock Quantity</label>
                    <input type="number" id="stock" name="stock" 
                           min="0" value="{{ product.stock if product else 0 }}"
                           placeholder="0" class="form-input">
                </div>
            </div>
            
            <div class="form-group">
                <label for="tags">Tags</label>
                <input type="text" id="tags" name="tags" 
                       value="{{ product.tags if product else '' }}"
                       placeholder="Enter tags separated by commas" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" class="form-input">
                    <option value="active" {% if product and product.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if product and product.status == 'inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">{{ action }} Product</button>
                <a href="{{ url_for('products') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
