{% extends "base.html" %}

{% block title %}Add User - Teenbaan{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div class="header-left">
            <h1>👤 Add New User</h1>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('users') }}" class="btn-secondary">← Back to Users</a>
        </div>
    </div>

    <div class="form-container">
        <form method="POST" class="order-form">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Enter username" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required 
                       placeholder="Enter email" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required 
                       minlength="6" placeholder="Enter password (min 6 characters)" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="role">Role *</label>
                <select id="role" name="role" class="form-input">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Create User</button>
                <a href="{{ url_for('users') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
