{% extends "base.html" %}

{% block title %}Edit User - Teenbaan{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div class="header-left">
            <h1>✏️ Edit User</h1>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('users') }}" class="btn-secondary">← Back to Users</a>
        </div>
    </div>

    <div class="form-container">
        <form method="POST" class="order-form">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required 
                       value="{{ user.username }}" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required 
                       value="{{ user.email }}" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="password">New Password (leave blank to keep current)</label>
                <input type="password" id="password" name="password" 
                       minlength="6" placeholder="Enter new password" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="role">Role *</label>
                <select id="role" name="role" class="form-input">
                    <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="status">Status *</label>
                <select id="status" name="status" class="form-input">
                    <option value="active" {% if user.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if user.status == 'inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Update User</button>
                <a href="{{ url_for('users') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
