{% extends "base.html" %}

{% block title %}My Profile - Teenbaan{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-left">
        <h1>👤 My Profile</h1>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="action" value="update_profile">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" required value="{{ user.username }}">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email or '' }}">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2>🔒 Change Password</h2>
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="action" value="change_password">
            
            <div class="form-group">
                <label for="current_password">Current Password *</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="new_password">New Password *</label>
                    <input type="password" id="new_password" name="new_password" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Change Password</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3>Account Info</h3>
    </div>
    <div class="card-body">
        <div class="order-info-grid">
            <div class="order-info-item">
                <label>User ID</label>
                <span>{{ user.id }}</span>
            </div>
            <div class="order-info-item">
                <label>Role</label>
                <span class="badge {{ 'badge-success' if user.role == 'admin' else 'badge-info' }}">{{ user.role }}</span>
            </div>
            <div class="order-info-item">
                <label>Status</label>
                <span class="badge {{ 'badge-success' if user.status == 'active' else 'badge-warning' }}">{{ user.status }}</span>
            </div>
            <div class="order-info-item">
                <label>Created</label>
                <span>{{ user.created_at or 'N/A' }}</span>
            </div>
            <div class="order-info-item">
                <label>Last Login</label>
                <span>{{ user.last_login or 'N/A' }}</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
