{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block title %}Edit Order - Teenbaan{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-left">
        <h1>✏️ Edit Order #{{ data[0] }}</h1>
    </div>
    <div class="header-actions">
        <a href="{{ url_for('orders') }}" class="btn btn-secondary">← Back to Orders</a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h2>📦 Order Details</h2>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>📅 Date</label>
                    <input type="text" value="{{ data[1] }}" disabled>
                </div>
                
                <div class="form-group">
                    <label>📆 Day</label>
                    <input type="text" value="{{ data[2] }}" disabled>
                </div>
                
                <div class="form-group">
                    <label>🕐 Time</label>
                    <input type="text" value="{{ data[3] }}" disabled>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>📦 Number of Orders</label>
                    <input type="number" name="orders" required min="1" value="{{ data[4] }}">
                </div>
                
                <div class="form-group">
                    <label>💰 Amount Spent (₹)</label>
                    <input type="number" name="amount" required min="0" step="0.01" value="{{ '%.2f'|format(data[5]) }}">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                <a href="{{ url_for('orders') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
