{% extends "base.html" %}

{% block title %}{{ action }} Category - Teenbaan{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div class="header-left">
            <h1>🏷️ {{ action }} Category</h1>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('categories') }}" class="btn-secondary">← Back to Categories</a>
        </div>
    </div>

    <div class="form-container">
        <form method="POST" class="order-form">
            <div class="form-group">
                <label for="name">Category Name *</label>
                <input type="text" id="name" name="name" required 
                       value="{{ category[1] if category else '' }}"
                       placeholder="Enter category name" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" 
                          placeholder="Enter category description" class="form-input">{{ category[2] if category else '' }}</textarea>
            </div>
            
            {% if action == 'Edit' %}
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" class="form-input">
                    <option value="active" {% if category and category[3] == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if category and category[3] == 'inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            {% endif %}
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">{{ action }} Category</button>
                <a href="{{ url_for('categories') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
